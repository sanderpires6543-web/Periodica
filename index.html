<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabela Periódica da Turma</title>
  <meta name="description" content="Tabela periódica interativa com os vídeos dos trabalhos da turma.">
  <meta name="theme-color" content="#171a43">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202456'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='19' fill='%23ffc94d'%3EPt%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <button id="rail-toggle" class="rail-toggle" type="button" aria-controls="works" aria-expanded="true" title="Tecla M">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path class="rail-line" d="M7.5 3.5v13"/><path class="rail-arrow" d="M13 7.5 10.5 10l2.5 2.5"/></svg>
      <span id="rail-label">Esconder alunos</span>
    </button>
    <h1>Tabela Periódica da Turma</h1>
    <label class="search">
      <span class="sr">Procurar elemento, número ou aluno</span>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5"/><path d="m12.5 12.5 4 4"/></svg>
      <input id="search" type="search" placeholder="Procurar elemento ou aluno" autocomplete="off" enterkeyhint="go">
      <output id="search-count" for="search"></output>
      <kbd id="search-key">/</kbd>
    </label>
  </header>

  <main id="layout" class="layout">
    <nav id="works" class="works" aria-labelledby="works-title">
      <div class="works-inner">
        <div class="works-head">
          <h2 id="works-title">Trabalhos</h2>
          <span id="progress"></span>
          <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        </div>
        <ul id="work-list"></ul>
        <p id="no-work" class="no-work" hidden>Nenhum trabalho corresponde à pesquisa.</p>
      </div>
    </nav>

    <section class="stage" aria-label="Tabela periódica">
      <div class="toolbar">
        <div id="modes" class="modes" role="group" aria-label="Colorir a tabela por"></div>
        <div id="legend" class="legend" role="group" aria-label="Filtrar elementos"></div>
      </div>
      <div class="table-wrap">
        <div id="table" class="table"></div>
      </div>
    </section>
  </main>

  <aside id="panel" class="panel" aria-label="Detalhes e vídeo" hidden>
    <div class="panel-bar">
      <button id="prev" class="icon-btn" type="button" aria-label="Anterior" title="Anterior">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg>
      </button>
      <button id="next" class="icon-btn" type="button" aria-label="Seguinte" title="Seguinte">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>
      </button>
      <button id="copy" class="text-btn" type="button">Copiar link</button>
      <button id="close" class="icon-btn" type="button" aria-label="Fechar painel" title="Fechar (Esc)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="videos.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
